name: Live API smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

jobs:
  verify-live-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One curl config for every check. "location" follows redirects, so a check
      # reaches the real app instead of passing on a redirect response alone.
      - name: Configure curl
        run: |
          cat > ~/.curlrc <<'CURLRC'
          fail
          silent
          show-error
          location
          retry = 3
          retry-delay = 5
          retry-all-errors
          max-time = 60
          output = /dev/null
          write-out = "%{http_code} %{url_effective}\n"
          CURLRC

      - name: FinVision API
        if: always()
        run: |
          curl https://finvision-api.onrender.com/
          curl https://finvision-api.onrender.com/health

      - name: Grounded Agent API
        if: always()
        run: |
          curl https://grounded-agent-api.vercel.app/health/live
          curl https://grounded-agent-api.vercel.app/docs

      - name: SecureShop API
        if: always()
        run: |
          curl https://secureshop-api.vercel.app/api/v1/health
          curl https://secureshop-api.vercel.app/api/v1/products
