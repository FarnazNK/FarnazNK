name: Live API smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

jobs:
  finvision-api:
    name: FinVision API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check FinVision health
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 45 https://finvision-api.onrender.com/health

  grounded-agent-api:
    name: Grounded Agent API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check RAG API liveness
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 45 https://grounded-agent-api.vercel.app/health/live

  secureshop-api:
    name: SecureShop API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SecureShop API health
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 45 https://secureshop-api-zckt.onrender.com/api/v1/health
